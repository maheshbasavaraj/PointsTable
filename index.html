<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Day • Overall Championship</title>
<meta name="description" content="Sports Day live points table and overall championship tracker">
<style>
:root{
  --orange:#ff6500; --orange2:#ff8a00; --bg:#080808; --panel:#111;
  --card:#171717; --line:#303030; --muted:#a7a7a7; --text:#f5f5f5;
  --green:#43d17a; --gold:#ffd166;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -18%,rgba(255,101,0,.09),transparent 48%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,select,input{font:inherit}
button{cursor:pointer}
.app{max-width:1200px;margin:auto;padding:22px}
.hero{border:1px solid var(--line);border-radius:18px;padding:22px;background:
 radial-gradient(ellipse at 0% 0%,rgba(255,101,0,.09),transparent 45%),linear-gradient(135deg,#111 0%,#171717 60%,#0d0d0d 100%);display:flex;
 justify-content:space-between;gap:20px;align-items:center;box-shadow:0 16px 45px rgba(0,0,0,.24)}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.college-logo{width:76px;height:76px;object-fit:contain;border-radius:50%;background:#fff;flex:none;box-shadow:0 0 22px rgba(255,209,102,.15);transition:transform .25s ease}
.kicker{color:var(--orange2);font-size:12px;font-weight:900;letter-spacing:2px}
h1{font-size:34px;line-height:1.05;margin:7px 0}
.subtitle{color:var(--muted);font-size:14px}
.trophy{font-size:58px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}
select,input,.btn{background:#191919;color:#fff;border:1px solid #444;border-radius:9px;padding:10px 12px;min-height:42px;transition:border-color .18s ease,background-color .18s ease,box-shadow .18s ease,transform .18s ease}
.btn{font-weight:800}
.btn:hover{border-color:var(--orange2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--orange2);outline-offset:2px}
select:focus,input:focus{border-color:var(--orange2);box-shadow:0 0 0 3px rgba(255,101,0,.15);outline:0}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#111}
.btn.danger{border-color:#743333}
.btn.active-edit{background:var(--green);border-color:var(--green);color:#111}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px;margin-bottom:16px}
.tab{white-space:nowrap;border:1px solid #333;background:#151515;color:#ccc;border-radius:999px;padding:9px 14px;font-weight:800}
.tab.active{background:var(--orange);border-color:var(--orange);color:#111;box-shadow:0 4px 16px rgba(255,101,0,.2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.card{background:linear-gradient(145deg,rgba(255,255,255,.018),transparent 42%),var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.15);transition:border-color .2s ease;animation:card-enter .32s ease both}
.card:hover{border-color:#45403b}
.card h2{font-size:18px;margin:0 0 5px}
.desc{font-size:12px;color:var(--muted);margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:linear-gradient(145deg,#1d1d1d,#151515);border:1px solid #292929;border-radius:10px;padding:10px;transition:border-color .2s ease,transform .2s ease}
.stat:hover{border-color:#65401f;transform:translateY(-2px)}
.stat b{display:block;font-size:19px}.stat span{font-size:9px;color:#999;text-transform:uppercase}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:570px}
th{text-align:left;font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.7px;padding:9px;border-bottom:1px solid #333}
td{padding:11px 9px;border-bottom:1px solid #292929;font-size:13px}
th:first-child,td.rank{position:sticky;left:0;z-index:2;width:38px;min-width:38px;background:#111}
th:nth-child(2),td.team{position:sticky;left:38px;z-index:2;background:#111;box-shadow:2px 0 4px rgba(0,0,0,.35)}
.rank{font-weight:900;color:#888}.team{font-weight:850}.points{font-weight:950;font-size:18px;color:var(--orange2)}
.champion{background:rgba(255,101,0,.11)}
.match{display:grid;grid-template-columns:1fr 110px 1fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #292929}
.match.custom-score-match{grid-template-columns:minmax(0,1fr) 65px 65px minmax(0,1fr);gap:6px}
.custom-score{width:100%;min-width:0;padding:7px 2px}
.match:last-child{border-bottom:0}
.team-name{font-size:13px;font-weight:800}.team-name.right{text-align:right}
.result{width:100%;padding:8px 4px;background:#1b1b1b;color:#fff;border:1px solid #444;border-radius:8px}
.section-title{color:var(--orange2);font-size:12px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;margin:15px 0 7px}
.note{border:1px dashed #3a3a3a;border-radius:9px;padding:11px;color:#aaa;font-size:12px;line-height:1.5}
.pool-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pool-card{background:#151515;border:1px solid #2d2d2d;border-radius:12px;padding:12px}
.pool-card h3{margin:0 0 10px;font-size:15px}
.pool-team{display:flex;gap:7px;margin:7px 0}.pool-team select{width:100%}
.small{font-size:11px;color:#999}
.knockout{border-left:3px solid var(--orange);padding-left:12px}
.champ-banner{padding:18px;border-radius:14px;border:1px solid #5a3b12;background:linear-gradient(135deg,#21160c,#15110c);margin-bottom:15px;animation:card-enter .38s ease both}
.champ-banner .big{font-size:27px;font-weight:950;color:var(--gold)}
.empty{padding:15px;border:1px dashed #3a3a3a;border-radius:10px;color:#999}
.footer{color:#777;font-size:11px;text-align:center;margin:20px 0 5px}
.result-display{display:block;text-align:center;color:var(--orange2);font-size:12px;font-weight:800}
.notice{display:none;border:1px solid #69401e;border-radius:9px;background:#21170f;color:#ffcb98;padding:10px 13px;margin:12px 0;font-size:13px}
.notice.show{display:block}.auth-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.auth-form input{min-width:180px}#loginPanel[hidden]{display:none}
.team-name{overflow-wrap:anywhere}
.table-wrap{-webkit-overflow-scrolling:touch;overscroll-behavior-inline:contain}
@keyframes card-enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(hover:hover){.college-logo:hover{transform:scale(1.04)}.tab:hover{border-color:var(--orange2);color:#fff}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(max-width:760px){
 .app{padding:12px}.hero{padding:15px}.brand{gap:11px}.college-logo{width:54px;height:54px}.trophy{display:none}h1{font-size:26px}
 .grid,.pool-grid{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
 .toolbar{gap:7px}.toolbar select,.toolbar .btn{flex:1 1 auto;min-width:0}
 .auth-form input{flex:1 1 100%;min-width:0;width:100%}.auth-form .btn{flex:1 1 auto}
 .card{padding:13px}.match{grid-template-columns:minmax(0,1fr) 82px minmax(0,1fr);gap:6px}
 .match.custom-score-match{grid-template-columns:minmax(0,1fr) 48px 48px minmax(0,1fr);gap:4px}
 .custom-score{padding:7px 0;font-size:14px}.table-wrap{max-width:100%}
}
@media(max-width:420px){
 .app{padding:9px}.hero{padding:12px;border-radius:13px}.brand{gap:9px}.college-logo{width:46px;height:46px}
 .kicker{font-size:9px;letter-spacing:1px}h1{font-size:22px}.subtitle{font-size:12px}
 .toolbar select,.toolbar .btn{flex:1 1 calc(50% - 7px);padding:9px 7px;font-size:13px}
 .tab{padding:8px 11px;font-size:13px}.card{padding:11px}.card h2{font-size:16px}
 .match{grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);gap:4px}.match.custom-score-match{grid-template-columns:minmax(0,1fr) 42px 42px minmax(0,1fr);gap:3px}
 .team-name{font-size:11px}.result{font-size:12px}.custom-score{font-size:13px}
 table{min-width:410px;table-layout:fixed}
 th:first-child,td.rank{display:none}
 th:nth-child(2),td.team{left:0;width:108px;min-width:108px;max-width:108px}
 th:nth-child(3),td:nth-child(3){width:48px}
 th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6){width:42px}
 th:nth-child(7),td:nth-child(7){width:68px}
 th{padding:7px 6px;font-size:9px}td{padding:8px 6px;font-size:11px}.points{font-size:15px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <section class="hero">
    <div class="brand">
      <img class="college-logo" src="./college_logo.png" alt="Dayananda Sagar Institutions logo">
      <div>
      <div class="kicker">DEPARTMENT OF CSE – DATA SCIENCE • SPORTS DAY</div>
      <h1>🏆 Overall Championship</h1>
      <div class="subtitle">Pool Stage • Knockouts • Live Points Table</div>
      </div>
    </div>
    <div class="trophy">🏆</div>
  </section>

  <div class="toolbar">
    <select id="eventSelect" aria-label="Select event"></select>
    <button class="btn primary" id="overallBtn">Overall Championship</button>
    <button class="btn" id="aboutBtn">About</button>
    <button class="btn admin-only" id="editBtn" hidden>Edit</button>
    <button class="btn admin-only" id="setupBtn" hidden>Team & Pool Setup</button>
    <button class="btn" id="exportBtn">Export Results</button>
    <button class="btn danger admin-only" id="resetBtn" hidden>Reset</button>
    <button class="btn" id="loginBtn">Admin Login</button>
    <button class="btn admin-only" id="logoutBtn" hidden>Sign out</button>
  </div>
  <form class="card auth-form" id="loginPanel" hidden>
    <input id="adminUsername" type="text" autocomplete="username" placeholder="Admin username" required>
    <input id="adminPassword" type="password" autocomplete="current-password" placeholder="Password" required>
    <button class="btn primary" type="submit">Sign in</button>
    <button class="btn" type="button" id="cancelLogin">Cancel</button>
  </form>
  <div class="notice" id="notice" role="status" aria-live="polite"></div>

  <div class="tabs" id="tabs"></div>
  <main id="content"></main>
  <div class="footer">Win = 4 points • Draw = 2 points each • Loss = 0 points</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
(() => {
'use strict';

const EVENTS = ['Basketball','Chess','Badminton','Tug of War','Box Cricket'];
const POOL_EVENTS = EVENTS;

const state = {
  teams: ['Team A','Team B','Team C','Team D','Team E','Team F'],
  pools: {},
  results: {}
};

const config = window.SUPABASE_CONFIG || {};
const db = window.supabase && config.url && config.publishableKey
  ? window.supabase.createClient(config.url, config.publishableKey)
  : null;
let isAdmin = false;
let editMode = false;
const notice = document.getElementById('notice');
function message(text){notice.textContent=text;notice.classList.toggle('show',Boolean(text));}
function renderAccess(){
  document.querySelectorAll('.admin-only').forEach(el=>{el.hidden=!isAdmin;});
  document.getElementById('loginBtn').hidden=isAdmin;
  document.getElementById('editBtn').hidden=!isAdmin;
  document.getElementById('editBtn').textContent=editMode?'Done Editing':'Edit';
  document.getElementById('editBtn').classList.toggle('active-edit',editMode);
  document.getElementById('setupBtn').hidden=!isAdmin||!editMode;
  document.getElementById('resetBtn').hidden=!isAdmin||!editMode;
  document.getElementById('logoutBtn').hidden=!isAdmin;
  if(!isAdmin){editMode=false;document.getElementById('loginPanel').hidden=true;}
}

POOL_EVENTS.forEach(e => state.pools[e] = {A:[0,1,2], B:[3,4,5]});
function normalizeData(data){
  const pools={...data.pools};
  if(pools.Volleyball)pools.Chess=pools.Volleyball;
  delete pools.Volleyball;
  const results={};
  Object.entries(data.results).forEach(([key,value])=>{
    if(!key.startsWith('Volleyball|')&&!key.startsWith('Chess|round|'))results[key]=value;
  });
  Object.entries(data.results).forEach(([key,value])=>{
    if(key.startsWith('Volleyball|'))results[`Chess|${key.slice('Volleyball|'.length)}`]=value;
  });
  return {...data,pools,results};
}

let current = 'overall';

async function save(){
  if(!db || !isAdmin){message('Sign in as the authorized admin to save changes.');return false;}
  const {error}=await db.from('tournament_state').update({state:{teams:state.teams,pools:state.pools,results:state.results},updated_at:new Date().toISOString()}).eq('singleton',true);
  if(error){message(`Could not save: ${error.message}`);return false;}
  message('Saved. Public standings are updated.');return true;
}
async function loadRemote(){
  if(!db)return;
  const {data,error}=await db.from('tournament_state').select('state').eq('singleton',true).single();
  if(error){message(`Could not load the shared results: ${error.message}`);return;}
  const x=data?.state && normalizeData(data.state);
  if(x && Array.isArray(x.teams) && x.teams.length===6 && x.pools && x.results){
    state.teams=x.teams;
    state.pools={...state.pools,...x.pools};
    state.results=x.results;
    show(current);
  }
}

const eventSelect = document.getElementById('eventSelect');
const tabs = document.getElementById('tabs');
const content = document.getElementById('content');

EVENTS.forEach(e => {
  const o = document.createElement('option');
  o.value = e; o.textContent = e;
  eventSelect.appendChild(o);

  const b = document.createElement('button');
  b.className = 'tab'; b.type = 'button'; b.textContent = e;
  b.dataset.event = e;
  b.addEventListener('click', () => show(e));
  tabs.appendChild(b);
});

function esc(v){
  return String(v).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function pairs(indices){
  const out=[];
  for(let i=0;i<indices.length;i++)
    for(let j=i+1;j<indices.length;j++) out.push([indices[i],indices[j]]);
  return out;
}
function emptyStats(){
  return state.teams.map(() => ({m:0,w:0,d:0,l:0,p:0}));
}
function customScores(result){
  if(result&&typeof result==='object'){
    const a=Number(result.a),b=Number(result.b);
    return Number.isInteger(a)&&a>=0&&a<=4&&Number.isInteger(b)&&b>=0&&b<=4?{a,b}:null;
  }
  if(result==='A')return {a:4,b:1};
  if(result==='B')return {a:1,b:4};
  if(result==='D')return {a:2,b:2};
  const match=typeof result==='string'&&result.match(/^([AB]):([0-4])$/);
  if(!match)return null;
  const points=Number(match[2]);
  return match[1]==='A'?{a:points,b:1}:{a:1,b:points};
}
function resultCode(result){
  const scores=customScores(result);
  if(scores)return scores.a===scores.b?'D':scores.a>scores.b?'A':'B';
  return typeof result==='string'?result.split(':')[0]:'';
}
function addResult(s,a,b,r,event=''){
  if(event==='Chess'||event==='Badminton'){
    const scores=customScores(r);
    if(!scores)return;
    s[a].m++;s[b].m++;s[a].p+=scores.a;s[b].p+=scores.b;
    if(scores.a===scores.b){s[a].d++;s[b].d++;}
    else if(scores.a>scores.b){s[a].w++;s[b].l++;}
    else{s[b].w++;s[a].l++;}
    return;
  }
  const code=resultCode(r);
  if(code !== 'A' && code !== 'B' && code !== 'D') return;
  s[a].m++; s[b].m++;
  if(code==='A'){s[a].w++;s[b].l++;s[a].p+=4}
  if(code==='B'){s[b].w++;s[a].l++;s[b].p+=4}
  if(code==='D'){s[a].d++;s[b].d++;s[a].p+=2;s[b].p+=2}
}
function id(...x){return x.join('|')}
function eventPoolStats(e){
  const s=emptyStats();
  ['A','B'].forEach(pool=>{
    pairs(state.pools[e][pool]).forEach(([a,b])=>{
      addResult(s,a,b,state.results[id(e,'pool',pool,a,b)],e);
    });
  });
  return s;
}
function overallStats(){
  const s=emptyStats();
  EVENTS.forEach(e=>{
    const x=eventPoolStats(e);
    x.forEach((v,i)=>{
      ['m','w','d','l','p'].forEach(k=>s[i][k]+=v[k]);
    });
    addKnockoutPoints(e,s);
  });
  return s;
}
function addKnockoutPoints(e,s){
  const q=qualified(e);
  if(q.A.length<2 || q.B.length<2)return;
  addResult(s,q.A[0],q.B[1],state.results[id(e,'semi',1)],e);
  addResult(s,q.B[0],q.A[1],state.results[id(e,'semi',2)],e);
  const s1=winner(q.A[0],q.B[1],state.results[id(e,'semi',1)]);
  const s2=winner(q.B[0],q.A[1],state.results[id(e,'semi',2)]);
  if(s1!==null && s2!==null)addResult(s,s1,s2,state.results[id(e,'final')],e);
}
function ranked(s){
  return s.map((x,i)=>({...x,index:i,team:state.teams[i]}))
    .sort((a,b)=>b.p-a.p || b.w-a.w || b.d-a.d || a.l-b.l || a.team.localeCompare(b.team));
}
function table(s){
  const rows=ranked(s);
  return `<div class="table-wrap"><table>
    <thead><tr><th>#</th><th>Team</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>Points</th></tr></thead>
    <tbody>${rows.map((x,i)=>`
      <tr class="${i===0 && x.p>0 ? 'champion':''}">
        <td class="rank">${i+1}</td>
        <td class="team">${i===0 && x.p>0?'🏆 ':''}${esc(x.team)}</td>
        <td>${x.m}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td>
        <td class="points">${x.p}</td>
      </tr>`).join('')}</tbody>
  </table></div>`;
}
function resultSelect(a,b,key){
  const v=state.results[key] || '';
  const code=resultCode(v), custom=/^(Chess|Badminton)\|/.test(key);
  if(custom){
    const scores=customScores(v);
    if(!editMode)return `<span class="result-display">${scores?`${scores.a} : ${scores.b}`:'—'}</span>`;
    return `<select class="result custom-score" data-result="${esc(key)}" data-score="a" aria-label="${esc(state.teams[a])} points"><option value="">—</option>${[0,1,2,3,4].map(n=>`<option value="${n}" ${scores?.a===n?'selected':''}>${n}</option>`).join('')}</select>
      <select class="result custom-score" data-result="${esc(key)}" data-score="b" aria-label="${esc(state.teams[b])} points"><option value="">—</option>${[0,1,2,3,4].map(n=>`<option value="${n}" ${scores?.b===n?'selected':''}>${n}</option>`).join('')}</select>`;
  }
  if(!editMode){
    const label=code==='A'?`${state.teams[a]} Win`:code==='B'?`${state.teams[b]} Win`:code==='D'?'Draw • 2 points each':'—';
    return `<span class="result-display">${esc(label)}</span>`;
  }
  return `<select class="result" data-result="${esc(key)}">
    <option value="">—</option>
    <option value="A" ${v==='A'?'selected':''}>${esc(state.teams[a])} Win</option>
    <option value="D" ${v==='D'?'selected':''}>Draw</option>
    <option value="B" ${v==='B'?'selected':''}>${esc(state.teams[b])} Win</option>
  </select>`;
}
function match(a,b,key){
  const custom=/^(Chess|Badminton)\|/.test(key);
  return `<div class="match${custom?' custom-score-match':''}">
    <div class="team-name">${esc(state.teams[a])}</div>
    ${resultSelect(a,b,key)}
    <div class="team-name right">${esc(state.teams[b])}</div>
  </div>`;
}
function winner(a,b,r){
  if(resultCode(r)==='A') return a;
  if(resultCode(r)==='B') return b;
  return null;
}
function poolStandings(e,pool){
  const s=emptyStats();
  pairs(state.pools[e][pool]).forEach(([a,b])=>{
    addResult(s,a,b,state.results[id(e,'pool',pool,a,b)],e);
  });
  return ranked(s).filter(x=>state.pools[e][pool].includes(x.index));
}
function qualified(e){
  const complete=pool=>{
    const rows=poolStandings(e,pool);
    return rows.length===3 && rows.every(x=>x.m===2);
  };
  return {
    A:complete('A')?poolStandings(e,'A').slice(0,2).map(x=>x.index):[],
    B:complete('B')?poolStandings(e,'B').slice(0,2).map(x=>x.index):[]
  };
}
function poolTable(e,pool){
  const rows = poolStandings(e,pool);
  return `<div class="table-wrap"><table>
    <thead><tr><th>#</th><th>Team</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>Points</th></tr></thead>
    <tbody>${rows.map((x,i)=>`
      <tr class="${i===0 && x.p>0 ? 'champion':''}">
        <td class="rank">${i+1}</td>
        <td class="team">${i===0 && x.p>0?'🏆 ':''}${esc(x.team)}</td>
        <td>${x.m}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td>
        <td class="points">${x.p}</td>
      </tr>`).join('')}</tbody>
  </table></div>`;
}
function poolMatches(e){
  return ['A','B'].map(pool=>`
    <section class="card">
      <h2>Pool ${pool}</h2>
      <div class="desc">3-team league — each team plays the other two teams.</div>
      ${pairs(state.pools[e][pool]).map(([a,b])=>match(a,b,id(e,'pool',pool,a,b))).join('')}
      <div class="section-title">Current Pool Standings</div>
      ${poolTable(e,pool)}
    </section>`).join('');
}
function knockout(e){
  const q=qualified(e);
  let html='';
  html+=`<section class="card"><h2>Semifinals</h2><div class="desc">Top 2 teams from each pool qualify.</div>`;
  if(q.A.length>=2 && q.B.length>=2){
    html+=match(q.A[0],q.B[1],id(e,'semi',1));
    html+=match(q.B[0],q.A[1],id(e,'semi',2));
  }else html+='<div class="empty">Complete the pool matches to determine the semifinalists.</div>';
  html+='</section>';

  const s1=q.A.length>=2&&q.B.length>=2?winner(q.A[0],q.B[1],state.results[id(e,'semi',1)]):null;
  const s2=q.A.length>=2&&q.B.length>=2?winner(q.B[0],q.A[1],state.results[id(e,'semi',2)]):null;
  html+=`<section class="card"><h2>Final</h2><div class="desc">Semifinal winners meet in the final.</div>`;
  if(s1!==null && s2!==null) html+=match(s1,s2,id(e,'final'));
  else html+='<div class="empty">Complete both semifinals to determine the finalists.</div>';
  html+='</section>';
  return html;
}
function setup(){
  return `<section class="card">
    <h2>Team & Pool Setup</h2>
    <div class="desc">Rename the six teams and assign three teams to each pool for every pool-based event.</div>
    <div class="pool-grid">
      ${state.teams.map((t,i)=>`<div class="pool-team">
        <label class="small" style="width:22px;padding-top:11px">${i+1}</label>
        <input class="team-input" data-index="${i}" value="${esc(t)}" aria-label="Team ${i+1} name">
      </div>`).join('')}
    </div>
    <button class="btn primary" id="saveTeams">Save Team Names</button>
    ${POOL_EVENTS.map(e=>`
      <div class="section-title">${esc(e)} Pools</div>
      <div class="pool-grid">
        ${['A','B'].map(p=>`
          <div class="pool-card"><h3>Pool ${p}</h3>
          ${[0,1,2].map(slot=>`
            <select class="pool-select" data-event="${esc(e)}" data-pool="${p}" data-slot="${slot}">
              ${state.teams.map((t,i)=>`<option value="${i}" ${state.pools[e][p][slot]===i?'selected':''}>${esc(t)}</option>`).join('')}
            </select>`).join('')}
          </div>`).join('')}
      </div>`).join('')}
    <div style="margin-top:15px"><button class="btn primary" id="savePools">Save Pool Assignments</button></div>
  </section>`;
}
function overall(){
  const s=overallStats(), rows=ranked(s), leader=rows.find(x=>x.p>0);
  return `${leader?`<div class="champ-banner"><div class="small">CURRENT LEADER</div><div class="big">🏆 ${esc(leader.team)}</div><div>${leader.p} championship points</div></div>`:''}
  <div class="grid">
    <section class="card">
      <h2>🏆 Overall Championship Points Table</h2>
      <div class="desc">All recorded pool, semifinal and final results are combined.</div>
      <div class="stats">
        <div class="stat"><b>${EVENTS.length}</b><span>Events</span></div>
        <div class="stat"><b>6</b><span>Teams</span></div>
        <div class="stat"><b>4</b><span>Win Points</span></div>
        <div class="stat"><b>2</b><span>Draw Points</span></div>
      </div>
      ${table(s)}
    </section>
    <section class="card">
      <h2>Tournament Format</h2>
      <div class="note">
        <b>Basketball:</b> 2 pools → top 2 from each pool → semifinals → final.<br><br>
        <b>Chess:</b> 2 pools → top 2 from each pool → semifinals → final.<br><br>
        <b>Tug of War:</b> 2 pools → top 2 from each pool → semifinals → final.<br><br>
        <b>Badminton:</b> 2 pools → top 2 from each pool → semifinals → final.<br><br>
        <b>Box Cricket:</b> 2 pools → top 2 from each pool → semifinals → final.<br><br>
      </div>
      <div class="section-title">Scoring</div>
      <div class="note">Win = <b>4 points</b> • Draw = <b>2 points each</b> • Loss = <b>0 points</b>.<br>For Chess and Badminton, assign <b>0–4 points to each player</b> per match. The higher score wins; equal scores count as a draw.</div>
    </section>
  </div>`;
}
function show(e){
  current=e;
  eventSelect.value=e==='about'?'':e;
  tabs.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.event===e));
  if(e==='about'){
    content.innerHTML=`<section class="card">
      <h2>About Sports Day</h2>
      <div class="desc">Department of CSE – Data Science • Dayananda Sagar Institutions</div>
      <p>This dashboard presents the Sports Day championship standings and match results across Basketball, Chess, Badminton, Tug of War and Box Cricket.</p>
      <p>Wins award 4 points, draws award 2 points to each team, and losses award 0 points. Chess and Badminton use organizer-assigned points from 0 to 4 for each player.</p>
      <p>Results are shared live with viewers. Only an authorized administrator can enter edit mode and update the tournament.</p>
      <img src="./college_logo.png" alt="Dayananda Sagar Institutions logo" style="display:block;width:min(220px,70%);margin:20px auto 0;border-radius:50%;background:#fff">
    </section>`;
    return;
  }
  if(e==='overall')content.innerHTML=overall();
  else content.innerHTML=`<div class="grid">${poolMatches(e)}</div><div class="grid" style="margin-top:15px">${knockout(e)}</div>
    <section class="card" style="margin-top:15px"><h2>${esc(e)} — Combined Points</h2><div class="desc">Pool-stage points plus knockout points already recorded.</div>${table(eventPoolStats(e))}</section>`;
  bind();
}
function bind(){
  if(!isAdmin||!editMode)return;
  content.querySelectorAll('[data-result]').forEach(el=>{
    el.addEventListener('change',()=>{
      const key=el.dataset.result,old=state.results[key];
      if(el.dataset.score){
        const row=el.closest('.match'),a=row.querySelector('[data-score="a"]').value,b=row.querySelector('[data-score="b"]').value;
        if(!a&&!b)delete state.results[key];
        else if(!a||!b){message('Assign points to both players in this match.');return;}
        else state.results[key]={a:Number(a),b:Number(b)};
      }else if(el.value)state.results[key]=el.value;else delete state.results[key];
      save().then(ok=>{if(ok)show(current);else{if(old)state.results[key]=old;else delete state.results[key];show(current);}});
    });
  });
  document.getElementById('saveTeams')?.addEventListener('click',()=>{
    const prior=JSON.stringify(state);
    content.querySelectorAll('.team-input').forEach(el=>{
      const v=el.value.trim();
      if(v) state.teams[Number(el.dataset.index)]=v;
    });
    save().then(ok=>{if(ok)show('overall');else{Object.assign(state,JSON.parse(prior));show('setup');}});
  });
  document.getElementById('savePools')?.addEventListener('click',()=>{
    const prior=JSON.stringify(state);
    POOL_EVENTS.forEach(e=>{
      ['A','B'].forEach(p=>{
        const vals=[...content.querySelectorAll(`.pool-select[data-event="${e}"][data-pool="${p}"]`)].map(x=>Number(x.value));
        if(new Set(vals).size!==3){message(`${e} Pool ${p} must contain three different teams.`);return;}
        state.pools[e][p]=vals;
      });
    });
    const valid=POOL_EVENTS.every(e=>new Set([...state.pools[e].A,...state.pools[e].B]).size===6);
    if(!valid){Object.assign(state,JSON.parse(prior));message('Each event must assign every team to exactly one pool.');return;}
    save().then(ok=>{if(ok)show('overall');else{Object.assign(state,JSON.parse(prior));show('setup');}});
  });
}
eventSelect.addEventListener('change',()=>show(eventSelect.value));
document.getElementById('overallBtn').addEventListener('click',()=>show('overall'));
document.getElementById('aboutBtn').addEventListener('click',()=>show('about'));
document.getElementById('editBtn').addEventListener('click',()=>{
  if(!isAdmin)return;
  editMode=!editMode;
  renderAccess();
  if(editMode)message('Edit mode is on. Changes save as you enter them.');
  else message('Edit mode is off. Results are read-only.');
  show(current==='about'?'overall':current);
});
document.getElementById('setupBtn').addEventListener('click',()=>{if(!isAdmin)return;current='setup';tabs.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));content.innerHTML=setup();bind();});
document.getElementById('loginBtn').addEventListener('click',()=>{
  const panel=document.getElementById('loginPanel');
  panel.hidden=false;
  if(!db){message('Supabase is not connected. Check the URL and publishable key in supabase-config.js.');return;}
  message('Enter your authorized admin username and password.');
  document.getElementById('adminUsername').focus();
});
document.getElementById('cancelLogin').addEventListener('click',()=>{document.getElementById('loginPanel').hidden=true;});
  document.getElementById('loginPanel').addEventListener('submit',async e=>{
  e.preventDefault();
  if(!db)return;
  const username=document.getElementById('adminUsername').value.trim();
  const password=document.getElementById('adminPassword').value;
  if(!username || !password){message('Enter both your admin username and password.');return;}
  message('Signing in…');
  const {data:admin,error:lookupError}=await db.from('tournament_admins').select('login_email').eq('username',username).maybeSingle();
  if(lookupError){message(`Could not check admin account: ${lookupError.message}`);return;}
  if(!admin?.login_email){message('Invalid admin username or password.');return;}
  const {error}=await db.auth.signInWithPassword({email:admin.login_email,password});
  if(error)message(error.message.includes('Email not confirmed')?'Confirm the admin email before signing in.':'Invalid admin username or password.');
});
document.getElementById('logoutBtn').addEventListener('click',()=>db?.auth.signOut());
if(db){
  db.auth.onAuthStateChange(async (_event,session)=>{
    if(!session?.user){isAdmin=false;renderAccess();return;}
    const {data:admin}=await db.from('tournament_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();
    isAdmin=Boolean(admin);
    renderAccess();
    if(isAdmin){document.getElementById('loginPanel').hidden=true;message('Admin signed in.');show(current);}
  });
}
document.getElementById('exportBtn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sports-day-results.json';a.click();URL.revokeObjectURL(a.href);
});
document.getElementById('resetBtn').addEventListener('click',async()=>{
  if(!isAdmin)return;
  if(!confirm('Reset all results, team names and pool assignments?'))return;
  const prior=JSON.stringify(state);
  state.teams=['Team A','Team B','Team C','Team D','Team E','Team F'];
  POOL_EVENTS.forEach(e=>state.pools[e]={A:[0,1,2],B:[3,4,5]});
  state.results={};
  if(await save())show('overall');else{Object.assign(state,JSON.parse(prior));show('overall');}
});
document.getElementById('loginBtn').hidden=false;
renderAccess();
if(!db){message('Configure Supabase in supabase-config.js to load and share live results.');show('overall');}
else{
  db.auth.getUser().then(({data,error})=>{
    if(error)message(`Authentication status: ${error.message}`);
    handleAccess(data?.user||null);
  });
  db.auth.onAuthStateChange((_event,session)=>{handleAccess(session?.user||null);});
  db.channel('sports-day-results').on('postgres_changes',{event:'UPDATE',schema:'public',table:'tournament_state'},loadRemote).subscribe();
  loadRemote();
}
async function handleAccess(user){
  if(!user){isAdmin=false;renderAccess();if(current==='setup')current='overall';show(current);return;}
  const {data,error}=await db.from('tournament_admins').select('user_id').eq('user_id',user.id).maybeSingle();
  isAdmin=!error&&Boolean(data);
  renderAccess();
  if(!isAdmin){if(current==='setup')current='overall';show(current);message('This account is not authorized to edit this tournament.');await db.auth.signOut();return;}
  message('Admin access enabled.');
  await loadRemote();
}
show('overall');
})();
</script>
</body>
</html>
